<!doctype html>
<html lang="pt-BR" class="dark" suppressHydrationWarning>
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` é o que habilita `env(safe-area-inset-*)`. A partir
         do Android 15 (targetSdk 35+) o sistema FORÇA desenho de ponta a ponta:
         sem isto o cabeçalho fica embaixo do relógio e o compositor do chat
         embaixo da barra de navegação. `maximum-scale=1` evita o zoom que o
         Android dá ao focar um campo, que desalinharia a conversa inteira. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <script>
      (function(){try{var e=localStorage.getItem('theme');if(e==='light'||(!e&&window.matchMedia('(prefers-color-scheme:light)').matches))document.documentElement.classList.remove('dark')}catch(e){}})();
    </script>
    <title>Central Whats</title>
    <meta name="description" content="Central de atendimento WhatsApp integrada ao Supabase e Evolution API" />
    <meta name="author" content="Central Whats" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/png" href="/logo.png?v=2" />
    <link rel="apple-touch-icon" href="/logo.png?v=2" />
    <meta property="og:image" content="/og-image.png" />
  </head>

  <body>
    <div id="root"></div>
    <script src="/env-config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
