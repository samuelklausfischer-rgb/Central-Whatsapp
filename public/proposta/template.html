<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Proposta Comercial — PRN Diagnósticos × Hospital São Donato</title>
<style>
/* ===== Regras críticas de impressão (não remover) ===== */
@page { size: 1440px 810px; margin: 0; }
html, body { margin: 0; padding: 0; }
*, *::before, *::after {
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}
body { hyphens: none; -webkit-hyphens: none; }

/* ===== STYLES: fonts.css + tokens.css + components.css ===== */
<!--STYLES-->
</style>
</head>
<body>

<!-- ===== SECTIONS: as 13 <section class="page"> da apresentação ===== -->
<!--SECTIONS-->

<!-- ===== QA: relatório de overflow por página (não altera layout) ===== -->
<div id="qa-report" style="display:none"></div>
<script>
window.addEventListener('load', function () {
  var PAGE_W = 1440, PAGE_H = 810, TOL = 0.5;
  var lines = [];
  var pages = document.querySelectorAll('.page');
  pages.forEach(function (page, i) {
    var n = i + 1;
    var problems = [];
    if (page.scrollHeight > PAGE_H) {
      problems.push('scrollHeight=' + page.scrollHeight + 'px (>810)');
    }
    if (page.scrollWidth > PAGE_W) {
      problems.push('scrollWidth=' + page.scrollWidth + 'px (>1440)');
    }
    var pr = page.getBoundingClientRect();
    var els = page.querySelectorAll('*');
    var reported = 0;
    els.forEach(function (el) {
      if (reported >= 5) return; // limita detalhe por página
      // decorativos com sangria intencional (recortados por overflow:hidden)
      if (el.classList.contains('blob') || el.closest('.bleed') || (el.className && String(el.className).indexOf('halo') !== -1)) return;
      var r = el.getBoundingClientRect();
      if (r.width === 0 && r.height === 0) return;
      var over = [];
      if (r.left   < pr.left   - TOL) over.push('left ' + (pr.left - r.left).toFixed(1) + 'px');
      if (r.right  > pr.right  + TOL) over.push('right ' + (r.right - pr.right).toFixed(1) + 'px');
      if (r.top    < pr.top    - TOL) over.push('top ' + (pr.top - r.top).toFixed(1) + 'px');
      if (r.bottom > pr.bottom + TOL) over.push('bottom ' + (r.bottom - pr.bottom).toFixed(1) + 'px');
      if (over.length) {
        var id = el.tagName.toLowerCase() +
                 (el.id ? '#' + el.id : '') +
                 (el.className && typeof el.className === 'string' && el.className.trim()
                   ? '.' + el.className.trim().split(/\s+/).slice(0, 3).join('.') : '');
        problems.push(id + ' ultrapassa: ' + over.join(', '));
        reported++;
      }
    });
    lines.push(problems.length
      ? 'PAGE ' + n + ': OVERFLOW ' + problems.join(' | ')
      : 'PAGE ' + n + ': OK');
  });
  if (!pages.length) lines.push('QA: nenhuma .page encontrada');
  document.getElementById('qa-report').textContent = lines.join('\n');
});
</script>
</body>
</html>
