# Gera o APK do Central Whats.
#
# POR QUE NO CI, e não na máquina do escritório: o build do Android exige JDK 17+
# e o SDK do Android (vários GB). A máquina de operação da clínica tem Java 8 e
# nenhum SDK, e instalar isso ali só para gerar um arquivo não se paga. Aqui o
# build também fica reprodutível — o mesmo commit gera o mesmo APK.
#
# O APK sai como ARTEFATO da execução: baixar em Actions → a execução → Artifacts.
name: APK Android

on:
  workflow_dispatch:
    inputs:
      tipo:
        description: 'debug (assinado com a chave de teste) ou release (exige keystore)'
        type: choice
        options: [debug, release]
        default: debug

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # JDK 21, não 17: o módulo `capacitor-android` compila com
      # `sourceCompatibility JavaVersion.VERSION_21` (ver
      # `node_modules/@capacitor/android/capacitor/build.gradle`). Com o 17 o
      # Gradle falha só lá no fim, em `compileDebugJavaWithJavac`, com
      # "invalid source release: 21".
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      # Node 22+: o CLI do Capacitor recusa versões abaixo disso. O Vite compila
      # normalmente no 20 e só o `cap sync` falha, então o erro aparece no fim de
      # um build que parecia bem-sucedido.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --ignore-scripts

      # O binário do Electron não é necessário aqui e é o download mais pesado
      # do `npm install` — por isso o `--ignore-scripts` acima.

      # As variáveis são EMBUTIDAS no bundle em tempo de build. Sem elas o app
      # instala, abre e fica sem backend, SEM erro de build — a armadilha já
      # documentada do release do Windows. Os valores padrão são os mesmos que o
      # `Dockerfile` do repo já usa (chaves publicáveis); defina os secrets para
      # sobrescrever.
      - name: Montar .env.local
        run: |
          cat > .env.local <<EOF
          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL || 'https://apps-supabase.srofjl.easypanel.host' }}
          VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzUyNzAwMDAwLCJleHAiOjIzODQ1MDAwMDB9.Gseqw0-_o6Nmwmz3mCWvgxjjCfJB1LhVgTV83uJe-F4' }}
          VITE_FINANCEIRO_SUPABASE_URL=${{ secrets.VITE_FINANCEIRO_SUPABASE_URL || 'https://afwrsrnzmqzteojbeeei.supabase.co' }}
          VITE_FINANCEIRO_SUPABASE_ANON_KEY=${{ secrets.VITE_FINANCEIRO_SUPABASE_ANON_KEY || 'sb_publishable_f0HmcgxIyRvw0e6pA_q6GQ_EF6t-k5W' }}
          EOF

      # Falha ANTES de compilar se alguma variável ficou vazia. A primeira versão
      # deste workflow só dava padrão para as URLs, e o APK saiu com a chave
      # vazia: instalava, abria e morria em "supabaseKey is required".
      - name: Conferir que nenhuma variável ficou vazia
        run: |
          faltando=""
          while IFS='=' read -r chave valor; do
            [ -z "$chave" ] && continue
            [ -z "$valor" ] && faltando="$faltando $chave"
          done < .env.local
          if [ -n "$faltando" ]; then
            echo "FALHA: variáveis vazias:$faltando"
            echo "O app compilaria e instalaria normalmente, e só quebraria ao abrir no celular."
            exit 1
          fi
          echo "OK: todas as variáveis preenchidas"

      - run: npm run build:mobile

      # Falha ALTO se o backend não entrou no bundle. Sem esta checagem o APK sai
      # "com sucesso" e só quebra no celular de quem instalou.
      - name: Conferir que o backend está embutido
        run: |
          # Confere CADA valor dentro do bundle, não só a URL. A versão anterior
          # olhava apenas a URL: a chave saiu vazia e o build passou.
          falhou=0
          while IFS='=' read -r chave valor; do
            [ -z "$chave" ] && continue
            if grep -rqlF "$valor" android/app/src/main/assets/public/assets/*.js; then
              echo "OK    $chave presente no bundle"
            else
              echo "FALHA $chave NÃO entrou no bundle"
              falhou=1
            fi
          done < .env.local
          if [ "$falhou" = "1" ]; then
            echo "O APK instalaria e abriria quebrado, sem erro de build."
            exit 1
          fi

      - name: Montar keystore (só release)
        if: inputs.tipo == 'release'
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "FALHA: release pedido sem ANDROID_KEYSTORE_BASE64 configurado."
            echo "Sem keystore próprio o APK sairia assinado com a chave de teste,"
            echo "e trocar a chave depois OBRIGA a equipe a desinstalar e reinstalar."
            exit 1
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Gradle
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ inputs.tipo }}" = "release" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Nomear o arquivo com a versão
        id: nome
        run: |
          V=$(node -p "require('./package.json').version")
          SRC=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          DEST="Central-Whats-${V}-${{ inputs.tipo }}.apk"
          cp "$SRC" "$DEST"
          echo "arquivo=$DEST" >> "$GITHUB_OUTPUT"
          ls -la "$DEST"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.nome.outputs.arquivo }}
          path: ${{ steps.nome.outputs.arquivo }}
          retention-days: 30
