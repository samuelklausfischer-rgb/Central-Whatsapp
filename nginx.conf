server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # O index.html precisa revalidar a cada carga. Ele e o unico arquivo com nome
    # fixo: os bundles do Vite levam hash no nome e por isso podem ser imutaveis
    # (bloco abaixo). Sem esta diretriz o navegador aplica cache heuristico no HTML,
    # continua servindo a versao antiga, e essa versao aponta para bundles antigos
    # que estao marcados como imutaveis por 1 ano — ou seja, nunca sao revalidados.
    # O deploy sobe correto no servidor e a tela do usuario nao muda.
    #
    # "no-cache" nao desliga o cache: obriga a perguntar ao servidor se mudou. Com
    # 4,5 kB, o custo e irrelevante perto de um deploy que nao chega.
    #
    # Os tres cabecalhos de seguranca sao repetidos aqui de proposito: no nginx,
    # `add_header` so e herdado do nivel anterior se o nivel atual NAO declarar
    # nenhum. Bastaria o Cache-Control para o index.html perder X-Frame-Options,
    # justamente no documento que importa proteger.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # sw.js, registerSW.js e manifest.webmanifest precisam do mesmo tratamento
    # do index.html e pelo mesmo motivo: nome fixo, sem hash. Sem "no-cache" o
    # navegador poderia servir um service worker ou manifesto velho depois de
    # um deploy novo. `location =` (correspondencia exata) tem prioridade
    # sobre QUALQUER `location ~*` (regex) no nginx, entao estes blocos valem
    # mesmo estando declarados antes da regra de imagens abaixo — a ordem no
    # arquivo nao importa entre os dois tipos, so entre regex e regex. De
    # qualquer forma nenhum dos tres nomes cai na regex de imagens: ela so
    # cobre ico|svg|png|jpg|jpeg|webp, e sw.js/registerSW.js sao .js e
    # manifest.webmanifest e .webmanifest.
    #
    # Os tres cabecalhos de seguranca sao repetidos aqui pelo mesmo motivo do
    # bloco do index.html: `add_header` so herda do nivel anterior se o nivel
    # atual nao declarar nenhum header proprio.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(ico|svg|png|jpg|jpeg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
